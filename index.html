
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>KM Studio | 3D Experience</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 32px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    main {
      width: 100%;
      padding: 10px 24px 30px;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      min-height: 450px;
      background: #202020;
      --poster-color: #202020;
    }

    .hint {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <header>KM STUDIO</header>

  <main>
    <model-viewer
      src="./palestra.glb"
      camera-controls
      auto-rotate
      rotation-per-second="15deg"
      interaction-prompt="auto"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      loading="eager">
    </model-viewer>

    <p class="hint">
      Trascina per ruotare · Usa la rotella per zoomare
    </p>
  </main>
</body>
</html>
